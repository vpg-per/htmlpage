<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{page_title}} Page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="{{ url_for('static', filename='jquery-3.6.0.min.js') }}"></script>
    <style>
        body { font-family: Arial, sans-serif; }
        h1, h2 { color: #333; }
        .container { display: flex; }
        .chart img { max-width: 100%; border: 1px solid #ccc; }
        table { border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>    
    <div>
    <div class="container">
        <div class="chart">
            <h5>{{page_title}} chart</h5>
            <img src="data:image/png;base64,{{ chart_image }}" >
        </div>
    </div>
        <br/><br/>
        <div>
            <table>
                <tr><th>Cycle-phases</th><th>Sectors</th></tr>
                <tr><td>Early expansion</td><td>XLK, XLY, XLF</td></tr>
                <tr><td>Mid expansion</td><td>XLI, XLK, XLV</td></tr>
                <tr><td>Late expansion</td><td>XLE, XLB</td></tr>
                <tr><td>Contraction</td><td>XLU, XLP, XLV, XLRE</td></tr>
                <tr><td>Not-in-phase</td><td>XLC</td></tr>
            </table>
        </div>
    </div>
</body>
</html>
